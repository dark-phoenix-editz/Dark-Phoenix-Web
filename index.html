<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Phoenix Editz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #020812;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .glitter {
            position: fixed;
            top: -10px;
            width: 3px;
            height: 3px;
            background: #00aaff;
            border-radius: 50%;
            box-shadow:
                0 0 6px #00aaff,
                0 0 12px #008cff,
                0 0 20px #006eff;
            animation: fall linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 45px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #ffffff;

            text-shadow:
                0 0 8px #00aaff,
                0 0 20px #008cff,
                0 0 40px #006eff,
                0 0 70px #004cff;
        }

        .subtitle {
            margin-top: 12px;
            font-size: 16px;
            color: #a9dfff;
            letter-spacing: 2px;
        }

        .login-box {
            width: 350px;
            margin: 40px auto 0;
            padding: 35px;

            background: rgba(2, 15, 30, 0.92);

            border: 1px solid #008cff;
            border-radius: 15px;

            box-shadow:
                0 0 10px #008cff,
                0 0 25px #0077ff,
                0 0 50px rgba(0, 119, 255, 0.6),
                inset 0 0 25px rgba(0, 140, 255, 0.15);

            animation: boxGlow 2s ease-in-out infinite alternate;
        }

        @keyframes boxGlow {
            from {
                box-shadow:
                    0 0 10px #008cff,
                    0 0 25px #0077ff,
                    0 0 40px rgba(0, 119, 255, 0.4);
            }

            to {
                box-shadow:
                    0 0 15px #00aaff,
                    0 0 35px #008cff,
                    0 0 70px rgba(0, 119, 255, 0.7);
            }
        }

        .login-box h2 {
            margin-bottom: 25px;
            font-size: 25px;
            color: #ffffff;

            text-shadow:
                0 0 10px #00aaff,
                0 0 20px #0077ff;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;

            background: #061321;
            color: white;

            border: 1px solid #24506e;
            border-radius: 8px;
            outline: none;
        }

        input::placeholder {
            color: #7ca5c2;
        }

        input:focus {
            border-color: #00aaff;

            box-shadow:
                0 0 8px #008cff,
                0 0 18px rgba(0, 140, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #0077ff;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            box-shadow:
                0 0 10px #0077ff,
                0 0 25px #006eff;

            transition: 0.3s;
        }

        button:hover {
            background: #00aaff;

            transform: scale(1.03);

            box-shadow:
                0 0 15px #00aaff,
                0 0 35px #008cff,
                0 0 60px #006eff;
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 30px;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 12px;
            }

            .login-box {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="glitter" style="left:5%; animation-duration:5s;"></div>
    <div class="glitter" style="left:12%; animation-duration:7s;"></div>
    <div class="glitter" style="left:20%; animation-duration:4s;"></div>
    <div class="glitter" style="left:28%; animation-duration:6s;"></div>
    <div class="glitter" style="left:35%; animation-duration:8s;"></div>
    <div class="glitter" style="left:43%; animation-duration:5s;"></div>
    <div class="glitter" style="left:50%; animation-duration:7s;"></div>
    <div class="glitter" style="left:58%; animation-duration:4s;"></div>
    <div class="glitter" style="left:65%; animation-duration:6s;"></div>
    <div class="glitter" style="left:72%; animation-duration:8s;"></div>
    <div class="glitter" style="left:80%; animation-duration:5s;"></div>
    <div class="glitter" style="left:88%; animation-duration:7s;"></div>
    <div class="glitter" style="left:95%; animation-duration:4s;"></div>

    <div class="container">

        <h1>DARK PHOENIX EDITZ</h1>

        <p class="subtitle">
            Official Wesite of Dark Phoenix Editz
        </p>

        <div class="login-box">

            <h2>LOGIN</h2>

            <input type="text" placeholder="Username">

            <input type="password" placeholder="Password">

            <button onclick="login()">
                LOGIN
            </button>

        </div>

    </div>

    <script>
        function login() {
            alert("Welcome to Dark Phoenix Editz!");
        }
    </script>

</body>
</html>
