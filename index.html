<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Phoenix Editz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 45px;
            font-weight: bold;
            letter-spacing: 4px;
            color: white;
            text-shadow:
                0 0 10px #ff0000,
                0 0 25px #ff0000,
                0 0 45px #ff0000;
        }
        .subtitle {
            margin-top: 10px;
            font-size: 16px;
            color: #bbbbbb;
            letter-spacing: 2px;
        }
        .login-box {
            width: 350px;
            margin: 40px auto 0;
            padding: 35px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #ff0000;
            border-radius: 15px;
            box-shadow:
                0 0 10px #ff0000,
                0 0 30px rgba(255, 0, 0, 0.6),
                0 0 60px rgba(255, 0, 0, 0.3);
        }
        .login-box h2 {
            margin-bottom: 25px;
            font-size: 25px;
            color: white;
        }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: #111;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
        }
        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #ff0000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0000;
        }
        button:hover {
            background: #cc0000;
            box-shadow:
                0 0 10px #ff0000,
                0 0 30px #ff0000;
        }
        @media (max-width: 500px) {
            h1 {
                font-size: 30px;
            }
            .login-box {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DARK PHOENIX EDITZ</h1>
        <p class="subtitle">
            Official Wesite of Dark Phoenix Editz
        </p>
        <div class="login-box">
            <h2>LOGIN</h2>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button onclick="login()">
                LOGIN
            </button>
        </div>
    </div>
    <script>
        function login() {
            alert("Welcome to Dark Phoenix Editz!");
        }
    </script>

</body>
</html>
